name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish as, e.g. v0.1.0. Leave empty to build only.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build macOS
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The same gate as a pull request. A release should never be the first
      # time this code ran here.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Decide how to sign
        id: mac
        env:
          CERT: ${{ secrets.MAC_CERTIFICATE_P12 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          if [ -n "$CERT" ] && [ -n "$APPLE_ID" ]; then
            echo "mode=signed" >> "$GITHUB_OUTPUT"
          elif [ -n "$CERT" ]; then
            echo "mode=signed-not-notarised" >> "$GITHUB_OUTPUT"
          else
            echo "mode=adhoc" >> "$GITHUB_OUTPUT"
          fi

      # electron-builder's own CSC_LINK handling is broken in 26.x: it creates
      # the temporary keychain with one random password and then authorises the
      # imported key with the .p12 password instead, so set-key-partition-list
      # always fails. Set the keychain up here and let electron-builder find the
      # identity by auto-discovery, which leaves CSC_LINK unset - it also has to
      # be unset for the ad-hoc path, where an empty CSC_LINK makes
      # electron-builder try to read the working directory as a certificate.
      - name: Import the signing certificate
        if: steps.mac.outputs.mode != 'adhoc'
        env:
          CERT: ${{ secrets.MAC_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          P12="$RUNNER_TEMP/certificate.p12"

          echo "$CERT" | base64 --decode > "$P12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # Prepend rather than replace, so the system roots stay searchable.
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          rm -f "$P12"

          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Package
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Ad-hoc, never -c.mac.identity=null. Skipping signing altogether
          # leaves the raw Electron binary's linker signature in place, which
          # covers neither the renamed executable nor the resources; macOS
          # refuses to launch an arm64 bundle in that state and calls it
          # "damaged". Ad-hoc still is not notarised, so a downloaded build
          # needs right-click Open once, but it does run.
          case "${{ steps.mac.outputs.mode }}" in
            signed)               npx electron-builder --mac --publish never -c.mac.notarize=true ;;
            signed-not-notarised) npx electron-builder --mac --publish never ;;
            adhoc)                npx electron-builder --mac --publish never -c.mac.identity=- ;;
          esac

      - uses: actions/upload-artifact@v5
        with:
          name: macOS
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    # A release needs a tag. Pushing one publishes; running this workflow by
    # hand publishes only when given a tag to publish as, and otherwise builds
    # all three platforms and leaves the artefacts on the run.
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          # Empty on a tag push, where the action takes the tag from the ref.
          tag_name: ${{ inputs.tag }}
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            Apple silicon macOS. Download the `.dmg`; the `.zip`, `.blockmap`
            and `.yml` files are how the updater finds its way back here.

            Allowance is read from Anthropic's usage endpoint using the token
            Claude Code already stores in the login Keychain. Everything else
            comes from the transcripts under `~/.claude/projects` and needs no
            credentials.

            Signed with a Developer ID certificate and notarised by Apple,
            so the `.dmg` opens with a double click. An installed build checks
            this page for newer releases and updates itself.
